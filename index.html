<style>
:root{--bg:#0a0c10;--surface:#12151c;--surface-2:#181c26;--line:#232935;--text:#eef1f6;--muted:#8a93a6;--faint:#5b6475;

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{padding:calc(30px + env(safe-area-inset-top)) 20px 22px;
 background:radial-gradient(120% 90% at 90% -10%,rgba(91,140,255,.18),transparent 60%),radial-gradient(90% 70% at -10% 0%,rgba(56,211,159,.12),transparent 55%),var(--surface);border-bottom:1px solid var(--line)}
.kicker{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--muted);font-weight:600}
h1{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;font-size:44px;line-height:.95;margin:6px 0 4px}
.sub{color:var(--muted);font-size:13.5px}
.wrap{padding:18px}
.info{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:14px;font-size:13px;color:var(--muted);line-height:1.6}
.info b{color:var(--text)}
.pbanner{border-radius:16px;padding:14px 16px;margin:18px 0 10px;border:1px solid var(--line)}
.pbanner.p1{background:linear-gradient(100deg,rgba(56,211,159,.16),rgba(18,21,28,.35))}
.pbanner.p2{background:linear-gradient(100deg,rgba(91,140,255,.20),rgba(18,21,28,.35))}
.pph{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:700;color:var(--muted)}
.ptitle{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;font-size:25px;line-height:1;margin:3px 0 5px}
.pmeta{font-size:12px;color:#c3cad8}
details.week{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:11px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:14px 15px;display:flex;align-items:center;gap:11px}
summary::-webkit-details-marker{display:none}
.wknum{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:5px 9px;color:var(--muted);flex:none}
.wktitle{flex:1;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:600;font-size:17px;letter-spacing:.02em}
.wkmeta{font-size:11px;color:var(--muted)}
.chev{width:18px;height:18px;flex:none;color:var(--muted);transition:transform .2s}
details[open] .chev{transform:rotate(180deg)}
.wkbody{padding:0 11px 11px}
.run{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-top:9px;border-left-width:3px;cursor:pointer}
.run.easy{border-left-color:var(--easy)}.run.long{border-left-color:var(--long)}
.run.tempo{border-left-color:var(--tempo)}.run.interval{border-left-color:var(--interval)}.run.race{border-left-color:var(--race)}
.rhead{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.rday{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.badge{margin-left:auto;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;font-size:10.5px;letter-spacing:.07em;padding:3px 8px;border-radius:6px}
.badge.easy{background:rgba(56,211,159,.14);color:var(--easy)}.badge.long{background:rgba(91,140,255,.16);color:var(--long)}
.badge.tempo{background:rgba(255,171,61,.16);color:var(--tempo)}.badge.interval{background:rgba(255,93,115,.16);color:var(--interval)}.badge.race{background:rgba(255,213,74,.16);color:var(--race)}
.rtitle{font-weight:600;font-size:15px;margin-bottom:3px}
.rsegs{font-size:12.5px;color:var(--muted);line-height:1.5}
.cardgo{margin-top:9px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;font-size:12.5px;letter-spacing:.05em;color:var(--muted);display:flex;align-items:center;gap:5px}
.cardgo b{color:var(--text)}
footer{padding:8px 24px 0;color:var(--faint);font-size:11.5px;text-align:center;line-height:1.6}
/* detail + player + summary overlays */
#detail,#summary{position:fixed;inset:0;background:var(--bg);z-index:55;max-width:560px;margin:0 auto;
 padding:calc(14px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));overflow:auto;display:none}
.dtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dtop .dt{color:var(--muted);font-size:13px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.04em}
.pclose{background:var(--surface-2);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer}
.dhead{border-left:3px solid var(--line);padding-left:12px;margin-bottom:6px}
.dhead.easy{border-left-color:var(--easy)}.dhead.long{border-left-color:var(--long)}.dhead.tempo{border-left-color:var(--tempo)}.dhead.interval{border-left-color:var(--interval)}.dhead.race{border-left-color:var(--race)}
.dhead .badge{margin-left:0;display:inline-block}
.dtitle{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;font-size:28px;line-height:1;margin:6px 0 3px}
.dmeta{color:var(--muted);font-size:13px}
.phase{margin-top:10px}
.phase-head{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:11px 11px 3px 3px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;font-size:15px;letter-spacing:.06em;color:#eef1f6}
.phase-head svg{width:15px;height:15px;flex:none}
.phase-head.warm{background:linear-gradient(90deg,#39414f,#2a3038)}
.phase-head.rep{background:linear-gradient(90deg,#f59e0b,#e0453f)}
.phase-head.race{background:linear-gradient(90deg,#e8bd45,#d99a2b);color:#1c1305}
.phase-card{background:var(--surface-2);border:1px solid var(--line);border-top:none;border-radius:3px 3px 12px 12px;overflow:hidden}
.phase-card.solo{border-top:1px solid var(--line);border-radius:12px}
.step{display:flex}.step + .step{border-top:1px solid var(--line)}
.step .num{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:700;font-size:19px;color:var(--muted);width:42px;flex:none;display:flex;align-items:center;justify-content:center}
.step .col{flex:1;border-left:1px solid var(--line);min-width:0}
.line{display:flex;align-items:center;gap:10px;padding:11px 13px 11px 14px}
.ltext{flex:1;min-width:0}
.stitle{font-weight:600;font-size:14.5px;line-height:1.3}
.ssub{color:var(--muted);font-size:12.5px;line-height:1.4;margin-top:2px}
.rside{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;font-size:12px;letter-spacing:.06em;white-space:nowrap}
.tag.run{color:#dfe4ee}.tag.run svg{width:14px;height:14px;color:#9aa4b6}.tag.rec{color:var(--muted)}
.hfchip{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.03em;color:var(--rt);background:rgba(166,132,255,.14);border:1px solid rgba(166,132,255,.3);border-radius:20px;padding:2px 8px;white-space:nowrap}
.startbtn{width:100%;border:none;border-radius:12px;padding:15px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;font-size:18px;letter-spacing:.05em;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;margin-top:16px}
.startbtn svg{width:18px;height:18px}
.startbtn.easy{background:var(--easy);color:#08130d}.startbtn.long{background:var(--long);color:#07101f}.startbtn.tempo{background:var(--tempo);color:#1c1305}.startbtn.interval{background:var(--interval);color:#210a0f}.startbtn.race{background:var(--race);color:#1c1305}

#player{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}

.ptop .pt{flex:1;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:600;font-size:16px}

.segcount{font-family:'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--muted);font-weight:700}
.segname{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;font-size:28px;line-height:1.02;margin:5px 0 5px}
.segcue{font-size:13px;color:#c3cad8}
.seghf{margin-top:5px;display:inline-block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12.5px;color:var(--rt);background:rgba(166,132,255,.14);border:1px solid rgba(166,132,255,.3);border-radius:20px;padding:2px 10px}
.segbig{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:60px;line-height:1;margin:11px 0 8px}
.segbar{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.segbar>div{height:100%;width:0;background:var(--long);border-radius:6px;transition:width .25s linear}

.ampel .astate{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;font-size:15px;letter-spacing:.05em;margin-top:2px}
.ampel.green{background:rgba(47,191,113,.15);border-color:var(--green)}.ampel.red{background:rgba(255,93,115,.15);border-color:var(--red)}.ampel.amber{background:rgba(255,171,61,.15);border-color:var(--amber)}.ampel.grey{background:var(--surface);border-color:var(--line)}
.astate.green{color:var(--green)}.astate.red{color:var(--red)}.astate.amber{color:var(--amber)}.astate.grey{color:var(--muted)}
.ampel.hr{background:rgba(166,132,255,.13);border-color:var(--rt)}.astate.hr{color:var(--rt)}
.mrow{display:flex;gap:10px;margin-top:12px}
.mcell{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px;text-align:center}
.mcell .ml{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--muted);font-weight:700}
.mcell .mv{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:27px;line-height:1.05;margin-top:2px}
.pctrl{margin-top:auto;display:flex;gap:10px;padding-top:14px}
.pctrl button{flex:1;border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:13px;padding:15px 8px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;font-size:15px;letter-spacing:.04em;cursor:pointer}
.pctrl .stop{background:rgba(255,93,115,.16);border-color:var(--red);color:var(--red)}.pctrl .skip{flex:.8}
.hint{margin-top:10px;font-size:11.5px;color:var(--faint);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>

function fmtPace(sp){if(sp==null||!isFinite(sp)||sp<=0)return '--:--';sp=Math.round(sp);return Math.floor(sp/60)+':'+String(sp%60).padStart(2,'0');}
function fmtTime(ms){let t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;return h>0?(h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')):(m+':'+String(s).padStart(2,'0'));}
function segLine(x){let t=x.mode==='time'?(x.dur>=60?(x.dur/60)+' min':x.dur+' s'):(x.dist>=1000?String(x.dist/1000).replace('.',',')+' km':x.dist+' m');return x.name.replace(/ \(\d+\/\d+\)/,'')+' · '+t;}
function findRun(id){for(const w of PLAN.weeks)for(const r of w.runs)if(r.id===id)return r;}

function renderPlan(){
 let h='<header><div class="kicker">Trainingsplan · 3×/Woche · Mo·Mi·Sa</div><h1>5K → 15K</h1>'+
   '<div class="sub">Silvesterlauf Werl–Soest · 15 km · 31. Dez 2026</div></header><div class="wrap">'+
   '<div class="info"><b>Ablauf:</b> Lauf antippen \u2192 Details ansehen \u2192 <b>Jetzt starten</b>. GPS misst Pace, Zeit &amp; Distanz, die Ampel zeigt den Zielbereich, bei jedem Abschnitt piept es. <b>Bildschirm an lassen.</b></div>'+
   '<div class="info"><b>Lockere Läufe läufst du nach Puls</b> – keine Pace-Ampel, nur die Ziel-HF-Zone (<b>Z2 \u2248 142\u2013156</b>). Bei Tempo/Intervallen zeigt die Ampel die Zielpace. HF-Zonen sind gesch\u00e4tzt (Karvonen · HFmax 200 · Ruhe 54); im Zweifel gilt der Sprech-Test \u2013 die App liest deinen Uhr-Puls nicht.</div>';
 let phase=0;
 PLAN.weeks.forEach(w=>{
   if(w.phase!==phase){phase=w.phase;
     h+= phase===1
       ? '<div class="pbanner p1"><div class="pph">Phase 1 — 5 km · bis 3. Okt</div><div class="ptitle">Basis &amp; Speed</div><div class="pmeta">3×/Woche · Mo · Mi · Sa</div></div>'
       : '<div class="pbanner p2"><div class="pph">Phase 2 — 15 km · bis 31. Dez</div><div class="ptitle">Silvesterlauf</div><div class="pmeta">3×/Woche · Mo · Mi · Sa</div></div>';}
   h+='<details class="week"><summary><span class="wknum">'+w.num+'</span><div style="flex:1"><div class="wktitle">'+w.title+'</div><div class="wkmeta">'+w.dates+' · '+w.vol+'</div></div>'+CHEV+'</summary><div class="wkbody">';
   w.runs.forEach(r=>{
     let seg=r.segments.map(segLine).filter((v,i,a)=>a.indexOf(v)===i).join(' · ');
     h+='<div class="run '+r.type+'" onclick="openDetail('+r.id+')"><div class="rhead"><span class="rday">'+r.day+' · '+r.date+'</span><span class="badge '+r.type+'">'+r.label+'</span></div><div class="rtitle">'+r.title+'</div><div class="rsegs">'+seg+'</div><div class="cardgo">Details &amp; Start ›</div></div>';
   });
   h+='</div></details>';
 });
 h+='<footer>GPS-Pace ist gegl\u00e4ttet und schwankt trotzdem \u2013 lauf nach Gef\u00fchl und Puls, nicht sklavisch nach Zahl.</footer></div>';
 $('app').innerHTML=h;
}

function openDetail(id){const r=findRun(id);if(!r)return;
 let h='<div class="dtop"><button class="pclose" onclick="closeDetail()">‹ Plan</button><span class="dt">'+r.day+' · '+r.date+'</span></div>';
 h+='<div class="dhead '+r.type+'"><span class="badge '+r.type+'">'+r.label+'</span><div class="dtitle">'+r.title+'</div><div class="dmeta">'+r.disp+'</div></div>';
 let n=0;
 r.outline.forEach(b=>{
   h+='<div class="phase">';
   if(b.header){h+='<div class="phase-head '+b.style+'">'+(b.style==='rep'?REPEAT:'')+'<span>'+b.header+'</span></div><div class="phase-card">';}
   else h+='<div class="phase-card solo">';
   b.steps.forEach(st=>{n++;
     const tag=st.kind==='recovery'?'<span class="tag rec">Erholung</span>':'<span class="tag run">'+RUNIC+'Laufen</span>';
     const nm=st.name.replace(/ \(\d+\/\d+\)/,'');
     const sub=st.cue?'<div class="ssub">'+st.cue+'</div>':'';
     const hf=st.hf?'<span class="hfchip">'+st.hf+'</span>':'';
     h+='<div class="step"><div class="num">'+n+'</div><div class="col"><div class="line"><div class="ltext"><div class="stitle">'+nm+'</div>'+sub+'</div><div class="rside">'+tag+hf+'</div></div></div></div>';
   });
   h+='</div></div>';
 });
 h+='<button class="startbtn '+r.type+'" onclick="closeDetail();startRun('+r.id+')">'+PLAY+' Jetzt starten</button>';
 h+='<div class="hint" style="margin-top:12px">Violett = Ziel-HF-Zone (gesch\u00e4tzt). Im Zweifel Sprech-Test.</div>';
 $('detail').innerHTML=h;$('detail').style.display='block';$('detail').scrollTop=0;
}
function closeDetail(){$('detail').style.display='none';}

let actx=null;
function initAudio(){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function beep(freq=880,dur=0.16){if(!actx)return;try{if(actx.state==='suspended')actx.resume();let o=actx.createOscillator(),g=actx.createGain();o.frequency.value=freq;o.type='sine';o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0.0001,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.35,actx.currentTime+0.02);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);o.start();o.stop(actx.currentTime+dur+0.02);}catch(e){}}

let S=null,wakeLock=null,tickTimer=null;
async function startRun(id){const run=findRun(id);if(!run)return;
 initAudio();beep(660,0.08);
 S={run,segs:run.segments,idx:0,totalMs:0,segMs:0,totalDist:0,segStartDist:0,paused:false,lastTick:performance.now(),lastPos:null,samples:[],kmSplits:[],nextKm:1000,watchId:null,finished:false};
 $('p-title').textContent=run.title;$('player').classList.add('on');$('summary').style.display='none';
 requestWake();startGPS();updateSeg();renderTick();tickTimer=setInterval(loop,200);
 document.addEventListener('visibilitychange',onVis);}
function onVis(){if(document.visibilityState==='visible'){requestWake();if(actx&&actx.state==='suspended')actx.resume();S&&(S.lastTick=performance.now());}}
async function requestWake(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}
function releaseWake(){try{wakeLock&&wakeLock.release();}catch(e){}wakeLock=null;}
function startGPS(){if(!('geolocation'in navigator)){$('p-state').textContent='Kein GPS';return;}S.watchId=navigator.geolocation.watchPosition(onPos,onGeoErr,{enableHighAccuracy:true,maximumAge:1000,timeout:15000});}
function onGeoErr(e){$('p-state').textContent='GPS: '+(e.code===1?'verweigert':'kein Signal');}
function haversine(a,b){const R=6371000,tr=Math.PI/180,dLat=(b.lat-a.lat)*tr,dLon=(b.lon-a.lon)*tr,la1=a.lat*tr,la2=b.lat*tr,x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function onPos(p){if(!S||S.finished)return;const cur={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,t:performance.now()};
 if(S.lastPos&&!S.paused){const d=haversine(S.lastPos,cur),dt=(cur.t-S.lastPos.t)/1000;
   if(cur.acc<=35&&d>0.3&&dt>0&&d/dt<6){S.totalDist+=d;S.samples.push({t:cur.t,d:S.totalDist});if(S.samples.length>240)S.samples.shift();while(S.totalDist>=S.nextKm){S.kmSplits.push({km:S.nextKm/1000,ms:S.totalMs});S.nextKm+=1000;}}}
 S.lastPos=cur;}
function curPace(){if(!S||S.samples.length<2)return null;const now=performance.now(),cutoff=now-15000;let old=S.samples[0];for(let i=S.samples.length-1;i>=0;i--){if(S.samples[i].t<=cutoff){old=S.samples[i];break;}}const dd=S.totalDist-old.d,dts=(now-old.t)/1000;if(dd<8||dts<=0)return null;return (dts/dd)*1000;}
function loop(){if(!S||S.finished)return;const now=performance.now(),dt=now-S.lastTick;S.lastTick=now;if(!S.paused){S.totalMs+=dt;S.segMs+=dt;}
 const seg=S.segs[S.idx];
 if(!S.paused){if(seg.mode==='time'&&S.segMs>=seg.dur*1000)nextSeg();else if(seg.mode==='distance'&&(S.totalDist-S.segStartDist)>=seg.dist)nextSeg();}
 renderTick();}
function nextSeg(){if(S.idx>=S.segs.length-1){finishRun();return;}S.idx++;S.segMs=0;S.segStartDist=S.totalDist;beep(880,0.16);updateSeg();}
function updateSeg(){const seg=S.segs[S.idx];$('p-segcount').textContent='Abschnitt '+(S.idx+1)+' / '+S.segs.length;
 $('p-segname').textContent=seg.name.replace(/ \(\d+\/\d+\)/,m=>m);$('p-segcue').textContent=seg.cue||'';
 const hf=$('p-seghf');if(seg.hf&&seg.guide!=='hr'){hf.style.display='inline-block';hf.textContent='Ziel-HF · '+seg.hf;}else hf.style.display='none';}
function renderTick(){if(!S)return;const seg=S.segs[S.idx];
 if(seg.mode==='time'){const rem=Math.max(0,seg.dur-S.segMs/1000);$('p-segbig').textContent=fmtTime(rem*1000);$('p-segprog').style.width=Math.min(100,(S.segMs/1000)/seg.dur*100)+'%';}
 else{const done=S.totalDist-S.segStartDist,rem=Math.max(0,seg.dist-done);$('p-segbig').textContent=(rem>=1000?(rem/1000).toFixed(2).replace('.',','):Math.round(rem))+(rem>=1000?' km':' m');$('p-segprog').style.width=Math.min(100,done/seg.dist*100)+'%';}
 $('p-time').textContent=fmtTime(S.totalMs);$('p-dist').textContent=(S.totalDist/1000).toFixed(2).replace('.',',');
 const avg=S.totalDist>50?(S.totalMs/1000)/(S.totalDist/1000):null;$('p-avg').textContent=fmtPace(avg);
 const cp=curPace();const am=$('p-ampel'),stt=$('p-state'),albl=$('p-albl'),pv=$('p-pace');
 if(seg.guide==='hr'){
   am.className='ampel hr';albl.textContent='Ziel-Herzfrequenz';stt.className='astate hr';
   let hz='Zone 2',det='';if(seg.hf){const pp=seg.hf.split(' · ');hz=pp[0];det=pp[1]||'';}
   if(det&&/\d/.test(det)){pv.textContent=det;stt.textContent=hz+' · nach Puls';}
   else{pv.textContent=hz;stt.textContent=det||'nach Puls';}
 } else {
   albl.textContent='Aktuelle Pace';pv.textContent=fmtPace(cp);
   let cls='grey',label='—';
   if(seg.lo==null){cls='grey';label=seg.kind==='recovery'?'Erholung':'freies Tempo';}
   else if(cp==null){cls='grey';label='messe…';}
   else if(cp<seg.lo){cls='red';label='zu schnell';}
   else if(cp>seg.hi){cls='amber';label=seg.kind==='recovery'?'ok':'etwas schneller';}
   else{cls='green';label='im Ziel';}
   am.className='ampel '+cls;stt.className='astate '+cls;stt.textContent=label;
 }}
function pauseToggle(){if(!S)return;S.paused=!S.paused;$('p-pause').textContent=S.paused?'Weiter':'Pause';if(!S.paused)S.lastTick=performance.now();}
function finishRun(){if(!S)return;S.finished=true;clearInterval(tickTimer);tickTimer=null;if(S.watchId!=null)navigator.geolocation.clearWatch(S.watchId);document.removeEventListener('visibilitychange',onVis);releaseWake();beep(520,0.3);showSummary();$('player').classList.remove('on');}
function showSummary(){const avg=S.totalDist>50?(S.totalMs/1000)/(S.totalDist/1000):null;let splits='';
 if(S.kmSplits.length){let prev=0;splits='<div style="margin-top:16px"><div class="segcount" style="text-align:left">Kilometer-Splits</div>';S.kmSplits.forEach(k=>{const p=(k.ms-prev)/1000;prev=k.ms;splits+='<div style="display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px"><span style="color:var(--muted)">km '+k.km+'</span><b style="font-family:\'Barlow Condensed\'">'+fmtPace(p)+' /km</b></div>';});splits+='</div>';}
 $('summary').innerHTML='<div class="kicker" style="color:var(--muted)">Lauf beendet</div><h1 style="font-size:34px;margin:4px 0 14px">'+S.run.title+'</h1>'+
  '<div class="mrow"><div class="mcell"><div class="ml">Distanz</div><div class="mv">'+(S.totalDist/1000).toFixed(2).replace('.',',')+' km</div></div><div class="mcell"><div class="ml">Zeit</div><div class="mv">'+fmtTime(S.totalMs)+'</div></div><div class="mcell"><div class="ml">Ø Pace</div><div class="mv">'+fmtPace(avg)+'</div></div></div>'+splits+
  '<div class="info" style="margin-top:18px">Nichts wird gespeichert \u2013 bei Bedarf Screenshot machen.</div><button class="startbtn long" onclick="closeSummary()">Zur\u00fcck zum Plan</button>';
 $('summary').style.display='block';S=null;}
function closeSummary(){$('summary').style.display='none';}

document.addEventListener('DOMContentLoaded',()=>{renderPlan();
 $('p-pause').onclick=pauseToggle;$('p-stop').onclick=finishRun;$('p-skip').onclick=()=>{if(S)nextSeg();};
 $('p-min').onclick=()=>{if(confirm('Lauf abbrechen und zur\u00fcck zum Plan?'))finishRun();};});
</script>
</body></html>
